name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: deploy-dashboard-service-${{ github.ref }}
  cancel-in-progress: false

env:
  REMOTE_PATH: /opt/dashboard-service
  REMOTE_ENV: /etc/masterdoc-dashboard-service/.env
  IMAGE_NAME: masterdoc-dashboard-service
  HEALTH_URL: http://127.0.0.1:8092/health

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    name: Deploy Compose to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$HOST" || { echo "Add secret DEPLOY_HOST"; exit 1; }
          test -n "$USER_NAME" || { echo "Add secret DEPLOY_USER"; exit 1; }
          test -n "$KEY" || { echo "Add secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }

      - name: Build image archive
        run: |
          docker build -t "${IMAGE_NAME}:${{ github.sha }}" -t "${IMAGE_NAME}:latest" .
          docker save "${IMAGE_NAME}:${{ github.sha }}" | gzip > /tmp/service.tar.gz

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Build runtime .env
        env:
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          test -n "$INTERNAL_SERVICE_TOKEN" || { echo "Add secret INTERNAL_SERVICE_TOKEN"; exit 1; }
          printf '%s\n' \
            'DASHBOARD_SERVICE_PORT=8092' \
            'CATALOG_BASE_URL=http://host.docker.internal:8091' \
            'MAINTENANCE_SERVICE_BASE_URL=http://host.docker.internal:8098' \
            'FEATURE_SERVICE_BASE_URL=http://host.docker.internal:8082' \
            "INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}" \
            'BOARD_HORIZON_WEEKS=4' \
            > runtime.env
          chmod 600 runtime.env

      - name: Rsync deploy files and load image
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30"
          $SSH "${USER_NAME}@${HOST}" "mkdir -p ${REMOTE_PATH}/deploy /etc/masterdoc-dashboard-service"
          rsync -avz -e "$SSH" \
            deploy/ "${USER_NAME}@${HOST}:${REMOTE_PATH}/deploy/"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            runtime.env "${USER_NAME}@${HOST}:${REMOTE_ENV}"
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            /tmp/service.tar.gz "${USER_NAME}@${HOST}:/tmp/${IMAGE_NAME}.tar.gz"
          $SSH "${USER_NAME}@${HOST}" bash -s <<EOF
          set -euo pipefail
          chmod 600 ${REMOTE_ENV}
          ln -sfn ${REMOTE_ENV} ${REMOTE_PATH}/deploy/.env
          gunzip -c /tmp/${IMAGE_NAME}.tar.gz | docker load
          cd ${REMOTE_PATH}/deploy
          export SERVICE_IMAGE=${IMAGE_NAME}:${{ github.sha }}
          docker compose --env-file .env up -d --no-build --wait --force-recreate
          curl -sf ${HEALTH_URL}
          EOF
