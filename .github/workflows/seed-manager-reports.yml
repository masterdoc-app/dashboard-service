name: Seed Manager Reports

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: Org to seed (Fixaverse Demo by default)
        required: true
        default: "382715225649971203"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed manager report work orders for org
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ORG_ID: ${{ inputs.org_id }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no "${USER}@${HOST}" \
            ORG_ID="$ORG_ID" bash -s <<'EOF'
          set -euo pipefail

          curl -sS -H "X-Org-Id: ${ORG_ID}" http://127.0.0.1:8091/sites >/tmp/sites.json
          SITE_ID="$(python3 -c 'import json; items=json.load(open("/tmp/sites.json")).get("items") or []; print(items[0]["id"] if items else "")')"
          if [[ -z "$SITE_ID" ]]; then
            echo "No sites found for org ${ORG_ID}"
            exit 1
          fi
          echo "SITE_ID=$SITE_ID"

          curl -sS -H "X-Org-Id: ${ORG_ID}" http://127.0.0.1:8091/assets >/tmp/assets.json
          ASSET_COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/assets.json")).get("items") or []))')"
          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "No assets found for org ${ORG_ID}. Run catalog-service workflow 'Seed Demo Assets' first."
            exit 1
          fi
          echo "ASSET_COUNT=$ASSET_COUNT"

          # Prefer a real catalog scope user as seed creator; fall back to X-User-Id style ops id.
          CREATOR_ID="$(
            (cd /opt/catalog-service/deploy && docker compose exec -T catalog-postgres \
              psql -U catalog -d catalog -tAc \
              "SELECT user_id FROM user_scopes WHERE org_id = '${ORG_ID}' ORDER BY user_id LIMIT 1") \
            || true
          )"
          CREATOR_ID="$(echo -n "$CREATOR_ID" | tr -d '[:space:]')"
          if [[ -z "$CREATOR_ID" ]]; then
            CREATOR_ID="seed-${ORG_ID}"
            echo "WARN: no user_scopes for org; using CREATOR_ID=$CREATOR_ID"
          else
            echo "CREATOR_ID=$CREATOR_ID"
          fi

          BODY="$(SITE_ID="$SITE_ID" CREATOR_ID="$CREATOR_ID" python3 - <<'PY'
          import json, os
          site_id = os.environ["SITE_ID"]
          creator = os.environ["CREATOR_ID"]
          items = json.load(open("/tmp/assets.json")).get("items") or []
          print(json.dumps({"siteId": site_id, "assetIds": [a["id"] for a in items], "createdBy": creator}))
          PY
          )"

          CODE="$(curl -sS -o /tmp/seed.json -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" \
            -d "$BODY" \
            "http://127.0.0.1:8092/internal/orgs/${ORG_ID}/seed-manager-reports")"
          echo "POST seed-manager-reports -> $CODE"
          cat /tmp/seed.json
          [[ "$CODE" == "200" ]] || exit 1

          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/seed.json"))
          print(f"deleted={r.get('deleted')} created={r.get('created')} orgId={r.get('orgId')}")
          PY

          FROM="$(python3 -c 'from datetime import date, timedelta; print((date.today()-timedelta(days=90)).isoformat())')"
          TO="$(python3 -c 'from datetime import date, timedelta; print((date.today()+timedelta(days=14)).isoformat())')"
          curl -sS -H "X-Org-Id: ${ORG_ID}" \
            "http://127.0.0.1:8092/reports/manager-kpis?from=${FROM}&to=${TO}" >/tmp/kpis.json

          python3 - <<'PY'
          import json
          k = json.load(open("/tmp/kpis.json"))
          print(
              f"KPIs {k.get('from')}..{k.get('to')}: "
              f"emergency={k.get('emergencyCount')} planned={k.get('plannedCount')} "
              f"mttr={k.get('mttrHours')} availability={k.get('availabilityPercent')}%"
          )
          PY
          EOF
