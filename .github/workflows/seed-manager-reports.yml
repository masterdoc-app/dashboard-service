name: Seed Manager Reports

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: Org to seed (Fixaverse Demo by default)
        required: true
        default: "382715225649971203"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Seed manager report work orders for org
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ORG_ID: ${{ inputs.org_id }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$KEY" > /tmp/deploy_key

          # Write remote script locally, then pipe via ssh.
          # Nested heredocs inside `ssh bash -s` steal stdin and abort early.
          cat > /tmp/seed_manager_reports_remote.sh <<'REMOTE'
          set -euo pipefail
          echo "seed start org=${ORG_ID}"

          curl -sS -H "X-Org-Id: ${ORG_ID}" http://127.0.0.1:8091/sites >/tmp/sites.json
          SITE_ID=$(python3 -c 'import json; items=json.load(open("/tmp/sites.json")).get("items") or []; print(items[0]["id"] if items else "")')
          test -n "$SITE_ID" || { echo "No sites for org ${ORG_ID}"; exit 1; }
          echo "SITE_ID=$SITE_ID"

          curl -sS -H "X-Org-Id: ${ORG_ID}" http://127.0.0.1:8091/assets >/tmp/assets.json
          ASSET_COUNT=$(python3 -c 'import json; print(len(json.load(open("/tmp/assets.json")).get("items") or []))')
          test "$ASSET_COUNT" -gt 0 || { echo "No assets for org ${ORG_ID}"; exit 1; }
          echo "ASSET_COUNT=$ASSET_COUNT"

          CREATOR_ID="seed-${ORG_ID}"
          echo "CREATOR_ID=$CREATOR_ID"
          export ORG_ID SITE_ID CREATOR_ID

          python3 -c '
          import json, os, urllib.request
          org = os.environ["ORG_ID"]
          site = os.environ["SITE_ID"]
          creator = os.environ["CREATOR_ID"]
          items = json.load(open("/tmp/assets.json")).get("items") or []
          body = json.dumps({
              "siteId": site,
              "assetIds": [a["id"] for a in items],
              "createdBy": creator,
          }).encode()
          print("BODY_BYTES", len(body), flush=True)
          req = urllib.request.Request(
              "http://127.0.0.1:8092/internal/orgs/%s/seed-manager-reports" % org,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=300) as resp:
              raw = resp.read().decode()
              print("POST", resp.status, raw, flush=True)
              open("/tmp/seed.json", "w").write(raw)
          r = json.load(open("/tmp/seed.json"))
          print("deleted=%s created=%s orgId=%s" % (r.get("deleted"), r.get("created"), r.get("orgId")), flush=True)
          '

          FROM=$(python3 -c 'from datetime import date, timedelta; print((date.today()-timedelta(days=90)).isoformat())')
          TO=$(python3 -c 'from datetime import date, timedelta; print((date.today()+timedelta(days=14)).isoformat())')
          curl -sS --max-time 60 -H "X-Org-Id: ${ORG_ID}" \
            "http://127.0.0.1:8092/reports/manager-kpis?from=${FROM}&to=${TO}" >/tmp/kpis.json
          python3 -c '
          import json
          k = json.load(open("/tmp/kpis.json"))
          print(
              "KPIs %s..%s: emergency=%s planned=%s mttr=%s availability=%s%%"
              % (k.get("from"), k.get("to"), k.get("emergencyCount"), k.get("plannedCount"), k.get("mttrHours"), k.get("availabilityPercent")),
              flush=True,
          )
          '
          echo "seed done"
          REMOTE

          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/seed_manager_reports_remote.sh "${USER}@${HOST}:/tmp/seed_manager_reports_remote.sh"
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "${USER}@${HOST}" \
            "ORG_ID=$(printf %q "$ORG_ID") bash /tmp/seed_manager_reports_remote.sh"
