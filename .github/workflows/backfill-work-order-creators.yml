# Ops: set created_by on work orders that lack a creator, across all orgs.
name: Backfill Work Order Creators

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only print plan (no UPDATE)"
        required: false
        default: "false"
      fallback_creator_id:
        description: "Optional user id when org has no assignee, peer creator, or catalog scope user"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backfill created_by on VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FALLBACK_CREATOR_ID: ${{ inputs.fallback_creator_id }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          $SCP scripts/backfill_work_order_creators.sh "${USER_NAME}@${HOST}:/tmp/backfill_work_order_creators.sh"
          $SSH "${USER_NAME}@${HOST}" \
            "chmod +x /tmp/backfill_work_order_creators.sh && DRY_RUN='$DRY_RUN' FALLBACK_CREATOR_ID='$FALLBACK_CREATOR_ID' /tmp/backfill_work_order_creators.sh"
